services:
  surge-geo-server:
    build: .
    platform: linux/amd64
    container_name: surge-geo-server
    user: "0:0"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
